# Redline's CI: thin on purpose, every rule lives in `redline ci`. See docs/design.md, section 7.
name: redline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]  # a label re-runs the approval check
  push:
    branches: [main]

permissions:
  contents: read  # each job says what it holds; only `note`, which runs no repository code, writes

concurrency:
  # a push run's own, so no merge's run is cancelled as a pending one; a PR's runs in turn, newest last
  group: ${{ github.event_name == 'push' && format('redline-push-{0}', github.run_id) || format('redline-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  suite:  # runs all of the PR's code, so it holds nothing to write and hands on nothing but its result (specs/, section 7)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04  # by version: -latest moves to a new OS
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # the ledger and check-order read the whole history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # the PR's own commits, not a merge
          persist-credentials: false
      - name: Fetch main and the CI notes
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags origin '+refs/heads/main:refs/heads/main' '+refs/notes/*:refs/notes/*'
        env:
          GH_TOKEN: ${{ github.token }}  # for this fetch alone, since the checkout keeps no credentials
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.15"  # exact: "3.12" gave Linux and Windows different patches
      - name: Install the merge-base's Redline into a venv of its own, to gate the PR, before any of the PR's code runs
        run: |  # not editable, with the merge-base's own pins, so the PR can't weaken the gate that checks it
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base main HEAD)"
          cd "$RUNNER_TEMP/base"  # first: python -m puts its directory, the PR's checkout, on sys.path
          python -m venv "$RUNNER_TEMP/gate"
          "$RUNNER_TEMP/gate/bin/python" -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          "$RUNNER_TEMP/gate/bin/python" -m pip install --require-hashes --force-reinstall -r requirements.txt
          "$RUNNER_TEMP/gate/bin/python" -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index .
      - run: |  # pip, every package by hash (mutmut, for check-break), then the PR's Redline, which downloads nothing
          python -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          python -m pip install --require-hashes --force-reinstall -r requirements.txt
          python -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index -e .
      - name: Check-break at an R step, then the suite, for the PR's step
        run: |  # the merge-base's Redline; the suite runs with the setup-python environment, the PR's own Redline
          "$RUNNER_TEMP/gate/bin/redline" ci suite --base main --python "$(command -v python)"

  redline:  # on a PR, the gates on the suite job's result and none of the PR's code; on a push, main's suite
    needs: suite
    if: always()  # a failed or cancelled suite job still gates, where a skipped gate would read as passed
    runs-on: ubuntu-24.04  # by version: -latest moves to a new OS
    permissions:
      actions: read  # the push run each CI note names, for the ledger; no job can write the runs
      contents: read
      issues: read  # who applied a PR's approval labels
      pull-requests: read
    outputs:
      note: ${{ steps.note.outputs.note }}  # the push run's note, base64, for the `note` job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # the ledger and check-order read the whole history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # the PR's own commits, not a merge
          persist-credentials: false
      - name: Fetch main and the CI notes
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags origin '+refs/heads/main:refs/heads/main' '+refs/notes/*:refs/notes/*'
        env:
          GH_TOKEN: ${{ github.token }}  # for this fetch alone, since the checkout keeps no credentials
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.15"  # exact: "3.12" gave Linux and Windows different patches
      - name: Install the merge-base's Redline into a venv of its own, to gate the PR, before any of the PR's code runs
        if: github.event_name == 'pull_request'
        run: |  # not editable, with the merge-base's own pins, so the PR can't weaken the gate that checks it
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base main HEAD)"
          cd "$RUNNER_TEMP/base"  # first: python -m puts its directory, the PR's checkout, on sys.path
          python -m venv "$RUNNER_TEMP/gate"
          "$RUNNER_TEMP/gate/bin/python" -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          "$RUNNER_TEMP/gate/bin/python" -m pip install --require-hashes --force-reinstall -r requirements.txt
          "$RUNNER_TEMP/gate/bin/python" -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index .
      - if: github.event_name == 'push'  # on a PR the PR's code runs in the suite job alone
        run: |  # pip, every package by hash (mutmut, for check-break), then Redline, which downloads nothing
          python -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          python -m pip install --require-hashes --force-reinstall -r requirements.txt
          python -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index -e .
      - name: Gates and ledger for the PR's step on the suite job's result, or the gates for a PR outside any step
        if: github.event_name == 'pull_request'
        run: |  # the merge-base's gate, reading the suite job's result and running none of the PR's code
          "$RUNNER_TEMP/gate/bin/redline" ci pr --base main --pr ${{ github.event.pull_request.number }} --suite-result "$SUITE"
        env:
          SUITE: ${{ needs.suite.result }}  # through env, as the job's result is all that reaches the gate
          GH_TOKEN: ${{ github.token }}
      - name: Run the suite and write the note for the merged commit
        if: github.event_name == 'push'
        run: redline ci push --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --note "$RUNNER_TEMP/note"
        env:
          GH_TOKEN: ${{ github.token }}  # the merged PR's claim labels, recorded in the note
      - name: Hand the note on, a failed run's too
        id: note
        if: always() && github.event_name == 'push'
        run: if [ -f "$RUNNER_TEMP/note" ]; then echo "note=$(base64 -w0 "$RUNNER_TEMP/note")" >> "$GITHUB_OUTPUT"; fi

  note:  # the only job that can write refs/notes/redline-ci, so it runs git alone (docs/design.md, section 7)
    needs: redline
    if: ${{ !cancelled() && github.event_name == 'push' && needs.redline.outputs.note != '' }}
    runs-on: ubuntu-24.04  # by version: -latest moves to a new OS
    permissions:
      contents: write
    steps:
      # the merged commit, to note; nothing in it runs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Add the note to the merged commit and push it, again over a push that overtook it
        run: |
          printf '%s' "$NOTE" | base64 -d > "$RUNNER_TEMP/note"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin '+refs/notes/*:refs/notes/*'
            git -c user.name=redline-ci -c user.email=redline-ci@users.noreply.github.com notes --ref=redline-ci add -f -F "$RUNNER_TEMP/note" "$GITHUB_SHA"
            git push origin refs/notes/redline-ci && exit 0
            sleep "$attempt"
          done
          exit 1
        env:
          NOTE: ${{ needs.redline.outputs.note }}  # through env, never ${{ }} in the script: the text is data

  runners:  # the real Jest, Stryker, mutmut and gh api calls, which the suite fakes (docs/design.md, sections 5 and 7)
    runs-on: ubuntu-24.04  # by version: -latest moves to a new OS
    permissions:  # the redline job's, so the real gh api calls read what its token can; records nothing
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.15"  # exact: "3.12" gave Linux and Windows different patches
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.23.3"  # pinned, as the toy's package-lock.json pins Jest and Stryker
      - run: npm ci --no-audit --no-fund
        working-directory: tests/toys/jest
      - run: |  # mutmut, proved here as Jest and Stryker are; every package by hash
          python -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          python -m pip install --require-hashes --force-reinstall -r requirements.txt
          python -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index -e .
      - name: Prove the Jest helper, REDLINE_SPEC, Stryker's counts and mutmut's credit on the real tools
        run: python -m pytest -v -p no:cacheprovider tests/test_runners.py tests/test_mutmut.py
        env:
          REDLINE_REAL_RUNNERS: "1"  # without it these tests are skipped
      - name: Make the GitHub seam's real gh api calls on this repository's merged PR
        run: python -m pytest -v -p no:cacheprovider tests/test_github.py
        env:
          REDLINE_REAL_GITHUB: "1"  # here, not in redline ci's suite: GitHub down fails this job, not the gates
          GH_TOKEN: ${{ github.token }}

  windows:  # Redline's suite where Python's own encoding isn't UTF-8 (docs/design.md, section 7)
    runs-on: windows-2025-vs2026  # windows-2025 changed its Visual Studio once
    permissions:
      contents: read  # records nothing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.10"  # the last 3.12 built for Windows; later ones are source-only
      - run: |  # pytest, not `redline ci`: mutmut doesn't run on Windows, so a marker keeps it off
          python -m pip install --require-hashes --force-reinstall -r requirements-pip.txt
          python -m pip install --require-hashes --force-reinstall -r requirements.txt
          python -m pip install --no-deps --no-build-isolation --check-build-dependencies --no-index -e .
        shell: bash  # stops at a failed line, as pwsh doesn't
      - run: python -m pytest -n auto -p no:cacheprovider
