# Redline's CI: thin on purpose, every rule lives in `redline ci`. See docs/design.md, section 7.
name: redline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]  # a label re-runs the approval check
  push:
    branches: [main]

permissions:
  contents: write  # push refs/notes/redline-ci after a run on main
  issues: read  # who applied a PR's approval labels
  pull-requests: read

concurrency:
  group: redline-${{ github.ref }}  # runs on main push notes one at a time
  cancel-in-progress: false

jobs:
  redline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ledger and check-order read the whole history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # the PR's own commits, not a merge
      - name: Fetch main and the CI notes
        run: git fetch --no-tags origin '+refs/heads/main:refs/heads/main' '+refs/notes/*:refs/notes/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mutation]"  # mutmut, for check-break
      - name: Gates, suite and ledger for the PR's step, or the gates for a PR outside any step
        if: github.event_name == 'pull_request'
        run: redline ci pr --base main --pr ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run the suite and note the result on the merged commit
        if: github.event_name == 'push'
        run: redline ci push --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}  # the merged PR's claim labels, recorded in the note

  runners:  # the real Jest, Stryker and mutmut on toys, which the suite fakes (docs/design.md, section 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"  # pinned, as the toy's package-lock.json pins Jest and Stryker
      - run: npm ci --no-audit --no-fund
        working-directory: tests/toys/jest
      - run: pip install -e ".[mutation]"  # mutmut, proved here as Jest and Stryker are
      - name: Prove the Jest helper, REDLINE_SPEC, Stryker's counts and mutmut's credit on the real tools
        run: python -m pytest -v -p no:cacheprovider tests/test_runners.py tests/test_mutmut.py
        env:
          REDLINE_REAL_RUNNERS: "1"  # without it these tests are skipped

  windows:  # Redline's suite where Python's own encoding isn't UTF-8 (docs/design.md, section 7)
    runs-on: windows-latest
    permissions:
      contents: read  # records nothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest-xdist==3.8.0  # pytest, not `redline ci`: mutmut doesn't run on Windows
      - run: python -m pytest -n auto -p no:cacheprovider
