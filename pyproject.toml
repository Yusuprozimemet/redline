[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.0.1"
description = "Spec-driven, test-first development: a requirement isn't real until a test has proved it can fail."
requires-python = ">=3.12"
dependencies = ["pytest>=8", "pyyaml>=6"]

[project.optional-dependencies]
mutation = ["mutmut==3.8.0"]  # check-break; Linux only, so CI runs it

[project.scripts]
redline = "redline.cli:main"

[project.entry-points.pytest11]
redline = "redline.plugin"

[tool.setuptools.package-data]
redline = ["helpers/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
